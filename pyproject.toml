[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nr-reciprocal-sim"
version = "0.1.0"
description = "Newton-Raphson reciprocal (1/b) simulation for convergence and numerical error analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
